# Class-skill universe — every skill referenced by classes.yaml,
# backgrounds.yaml, or feats.yaml must be listed here.
#
# Source: docs/reference/classes.md class skill lists +
# docs/reference/backgrounds.md Table 2-1 +
# docs/reference/skills.md (skill descriptions ported from the
# Wheel of Time RPG, ch. 4, pp. 64-87).
#
# `ability` is the keyed ability used by the skill check
# (Str/Dex/Con/Int/Wis/Cha). `description` is one paragraph of
# in-world flavor + the most-used mechanic — rendered by the
# chargen `i <#>` info command on the skills picker.

- id: appraise
  name: Appraise
  ability: Int
  description: |-
    Estimate an item's worth, from a Tairen lute to a shipment of
    Sharan silks. Common goods are easy (DC 12, accurate to within
    10%); rare or exotic items take a higher DC and yield a 50-150%
    estimate.
- id: balance
  name: Balance
  ability: Dex
  description: |-
    Walk a tightrope, beam, ledge, or icy footing without falling.
    A failed check by 5 or more drops you. While balancing you lose
    your Dex bonus to Defense.
- id: bluff
  name: Bluff
  ability: Cha
  description: |-
    Make the outrageous or untrue seem plausible — lying, conning,
    fast-talking, misdirection. Opposed by Sense Motive. Also used
    to feint in combat (deny an opponent their Dex to Defense for
    one attack) and to create a diversion so you can Hide while
    observed.
- id: climb
  name: Climb
  ability: Str
  description: |-
    Scale a cliff, scramble up to a second-storey window, climb a
    rope or rough wall. DCs run 0 (steep slope with rope) to 25
    (overhang). A failure by 5 or more drops you. Climbing is
    one-quarter speed (full-round), or one-half speed at -5.
- id: concentration
  name: Concentration
  ability: Con
  description: |-
    Stay focused under pressure — keep a weave aligned while
    taking damage, study a clue in a moving wagon, eavesdrop while
    pretending to nap. Channelers use this for every difficult
    cast: link, overchannel, unlace, hold a weave through
    distractions.
- id: craft
  name: Craft
  ability: Int
  description: |-
    Make an item — armor, bows, weapons, leatherwork, pottery,
    calligraphy, jewellery, masonry. Each trade is a separate skill
    (Craft (armorsmithing), Craft (bowmaking), etc.). A successful
    craftsman earns about half their check result in silver marks
    per week of dedicated work.
- id: decipher_script
  name: Decipher Script
  ability: Int
  description: |-
    Puzzle out unfamiliar writing — an Age-of-Legends inscription,
    a coded letter, a partially-erased map. DC 20 for simple
    messages, 30+ for ancient or alien scripts. Trained-only;
    failure may give a false reading you don't notice.
- id: diplomacy
  name: Diplomacy
  ability: Cha
  description: |-
    Change someone's attitude — negotiate passage with an Atha'an
    Miere raker, calm a feud between Cairhienin houses, persuade
    Children of the Light to leave peacefully. Also drives
    haggling: each 5 points of margin shifts a price 5%.
- id: disguise
  name: Disguise
  ability: Cha
  description: |-
    Change your appearance — minor details, opposite sex (-2),
    different age (-2 per step), different background. Opposed by
    Spot. Friends and close associates spot through disguises more
    easily.
- id: forgery
  name: Forgery
  ability: Int
  description: |-
    Fake a document — military orders, a House seal, a deed, a
    map purporting to be from the Age of Legends. Opposed by the
    reader's Forgery check, modified by their familiarity with the
    document type and handwriting.
- id: gather_information
  name: Gather Information
  ability: Cha
  description: |-
    Spend an evening in taverns and markets buying drinks and
    asking questions. DC 10 yields the major news of the city;
    DC 15-25 finds specifics ("which way to the hidden bandit
    camp?"). Cannot be used without speaking the local language.
- id: handle_animal
  name: Handle Animal
  ability: Cha
  description: |-
    Train a domestic animal, drive a team, raise a wild creature
    from infancy. Teaching tricks takes two months and 1 rank per
    trick. Cannot be used to train inherently hostile creatures.
- id: heal
  name: Heal
  ability: Wis
  description: |-
    Save a dying friend, help allies recover faster, treat poison
    or disease. First aid is DC 15; long-term care doubles natural
    healing. A healer's kit gives +2; a trained healer can also use
    healer's balm to restore lost hit points beyond standard rest.
- id: hide
  name: Hide
  ability: Dex
  description: |-
    Sink into shadows, slip past a guard post, tail someone through
    a city. Opposed by Spot. Half-speed = no penalty; full speed =
    -5; running or charging = -20. Size shifts the result wildly
    (Tiny +8, Large -4, Huge -8).
- id: innuendo
  name: Innuendo
  ability: Wis
  description: |-
    Send and receive secret messages while appearing to talk about
    something else. DC 10 for simple meaning, 15-20 for complex.
    Eavesdroppers must beat your Innuendo check to read the hidden
    message.
- id: intimidate
  name: Intimidate
  ability: Cha
  description: |-
    Make a guard back down, force a prisoner to talk, cow a tavern
    brawl. Opposed by the target's level + bonuses against fear.
    Verbal threats and body language are both part of the skill.
- id: intuit_direction
  name: Intuit Direction
  ability: Wis
  description: |-
    Concentrate for a minute and find true north relative to your
    position (DC 15). On a natural 1 you confidently identify a
    wrong direction. Trained-only; untrained characters must
    navigate by landmarks and clues.
- id: jump
  name: Jump
  ability: Str
  description: |-
    Leap pits, low fences, or up to a tree branch. Running jump =
    5 ft minimum + 1 ft per check point above 10 (max = height x6).
    Standing jump is half that. High jumps are roughly one-fifth
    the distance.
- id: knowledge
  name: Knowledge
  ability: Int
  description: |-
    Recall a body of lore — Arcana, geography, history, nobility &
    royalty, the Age of Legends, etc. Each field is a separate
    skill. Trained-only; untrained characters fall back on a raw
    Int check and only know common knowledge.
- id: knowledge_blight
  name: Knowledge (Blight)
  ability: Int
  description: |-
    Specific lore about the Blight — the denizens that walk it,
    the way it twists living things, the safe paths through its
    edge. Trained-only.
- id: knowledge_local
  name: Knowledge (Local)
  ability: Int
  description: |-
    Specific lore about your home region — its legends, factions,
    inhabitants, customs, and the kind of trouble strangers walk
    into. Trained-only.
- id: listen
  name: Listen
  ability: Wis
  description: |-
    Hear an approaching enemy, eavesdrop, detect someone sneaking
    up. DCs run 0 (people talking) to 30 (a Myrddraal moving on a
    smooth surface). +1 DC per 10 ft from the source; +5 through a
    door, +15 through a stone wall.
- id: move_silently
  name: Move Silently
  ability: Dex
  description: |-
    Sneak up behind an enemy, slip past a sleeping guard, leave a
    room without being heard. Opposed by Listen. Half-speed = no
    penalty; full speed = -5; running or charging is essentially
    impossible.
- id: open_lock
  name: Open Lock
  ability: Dex
  description: |-
    Pick padlocks, finesse combination locks, solve puzzle locks.
    Trained-only, full-round action; thieves' tools mandatory
    (improvised tools = -2, masterwork = +2). DCs: very simple 20,
    average 25, good 30, amazing 40.
- id: perform
  name: Perform
  ability: Cha
  description: |-
    Entertain an audience with one specific art — ballad, dance,
    drums, flute, harp, lute, mime, oratory, singing, storytelling.
    Each art is a separate skill. Routine performance earns ~1d10
    silver pennies per day; great performance can land you a
    noble's patronage.
- id: profession
  name: Profession
  ability: Wis
  description: |-
    Practice a livelihood — apothecary, bookkeeper, brewer, cook,
    farmer, herbalist, innkeeper, sailor, scribe, etc. Each
    profession is a separate skill. Trained-only; earns about half
    your check result in silver marks per week.
- id: profession_sailor
  name: Profession (Sailor)
  ability: Wis
  description: |-
    The sea-folk's craft — knots, sail trim, weather sense, and
    standing a deck watch through a Stormy night without losing
    your nerve. Trained-only.
- id: ride
  name: Ride
  ability: Dex
  description: |-
    Ride one familiar mount type — horse (incl. mules and ponies),
    to'raken, raken, etc. Riding a different mount-type is at -2 to
    -5 ranks. Most casual riding requires no check; battle, leaps,
    and bareback riding do.
- id: search
  name: Search
  ability: Int
  description: |-
    Scour a 5-ft area for hidden compartments, traps, or small
    clues. DC 10 to ransack; DC 20 to find a typical secret door;
    DC 25+ for cleverly-hidden traps. Tracking requires the Track
    feat — Search alone only finds tracks at DC <= 10.
- id: sense_motive
  name: Sense Motive
  ability: Wis
  description: |-
    Read another character's body language and tell when they're
    bluffing, lying, or hiding ill intent. Opposed by Bluff. Also
    used to make a "hunch" check (DC 20) about a social situation
    in general.
- id: spot
  name: Spot
  ability: Wis
  description: |-
    Notice opponents waiting in ambush, an assassin in the shadows,
    a lurking pickpocket. Opposed by Hide. -1 per 10 ft of
    distance, -5 if the spotter is distracted.
- id: swim
  name: Swim
  ability: Str
  description: |-
    Move through water at one-quarter speed (move) or one-half
    speed (full-round). Calm water is DC 10; rough 15; stormy 20.
    Failing by 5 starts you drowning. Held breath: Con x rounds.
    Armor and gear cost -1 Swim per 5 lb carried.
- id: use_rope
  name: Use Rope
  ability: Dex
  description: |-
    Tie firm knots, slip-knots, or special bindings; bind
    prisoners; splice ropes. A typical knot is DC 10; a tricky
    special-purpose knot is DC 15. When you bind someone, you get
    +10 inherent on the opposed Escape Artist check.
- id: wilderness_lore
  name: Wilderness Lore
  ability: Wis
  description: |-
    Hunt and forage on the move (DC 10 keeps the party fed at half
    overland speed), shelter against severe weather (DC 15), follow
    tracks (with the Track feat), avoid natural hazards. Required
    for the Track feat.
