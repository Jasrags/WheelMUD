# Hero classes — docs/reference/classes.md, Tables 3-2..3-10.
#
# `bab` keys the Base Attack Bonus formula:
#   high   = +1/level   (Algai'd'siswai, Armsman, Woodsman)
#   medium = +3/4/level (Initiate, Noble, Wilder, Wanderer)
#   low    = +1/2/level (reserved for future variants)
# `save_*` is "high" (good progression) or "low" (poor progression);
# the per-level numeric value is derived from class + level by the
# combat math in Phase D.
# `skill_points` is the per-level base; 1st level multiplies by 4.
# `key_abilities` is the priority list from each class's narrative.

- id: algai_d_siswai
  name: Algai'd'siswai
  abbrev: Alg
  hit_die: 10
  bab: high
  save_fort: low
  save_ref: high
  save_will: low
  skill_points: 4
  class_skills:
    - balance
    - climb
    - craft
    - hide
    - intimidate
    - intuit_direction
    - jump
    - listen
    - move_silently
    - wilderness_lore
  key_abilities: [Str, Dex, Con, Wis]
  channeler: false
  description: |-
    Aiel desert warriors. Fast movement, Weapon Focus (shortspear),
    Dance the Spears, Uncanny Dodge. Cannot wear armor; cannot use
    swords (forfeit XP if violated).

