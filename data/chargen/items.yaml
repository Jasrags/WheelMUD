# Starting-equipment templates referenced by `backgrounds.yaml`'s
# `equipment_options[].items` lists. Schema mirrors `data/world/`
# items: type / weight / value / quality / flags / typed stats.
# These templates are content, not state — the chargen substep
# clones them via ItemRepo.Create with a unique runtime
# external_id (`<id>#cgen-<charID>-<i>`); the catalog rows never
# live in any room or container.

