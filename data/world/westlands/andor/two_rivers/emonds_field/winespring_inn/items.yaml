# Phase E #25 slice 2 — seed potions wired to the effects catalog.
# `effect_id_string` resolves through chargen.HashID to the runtime
# int32 EffectID. Boot-time validateConsumableEffectRefs cross-checks
# the hash against the catalog so a typo here fails the boot loudly.
