# --- North Road spine -------------------------------------------------------

- id: tr.north_road.taren_south
  name: The North Road, near Taren Ferry
  short: A muddy stretch of road south of the ferry.
  long: |
    Wagon ruts trace deep grooves through the wet earth. The river
    falls behind you to the north; ahead the road climbs gently toward
    Watch Hill.
  exits:
    n: tr.taren_ferry
    s: tr.watch_hill
  sector: field

- id: tr.north_road.central
  name: The North Road, in open country
  short: Open farmland flanks the road on both sides.
  long: |
    Hedgerows of blackthorn and hawthorn wall the road in. To the west
    the Westwood rises in a dark green line; to the east, low fields
    roll away toward the Waterwood.
  exits:
    n: tr.watch_hill
    se: tr.emonds_field.green
    w: tr.westwood.north
  sector: field

- id: tr.north_road.south
  name: The North Road, south of Emond's Field
  short: The road bends away toward Deven Ride.
  long: |
    The hedgerows give way to scattered oaks. A south wind brings the
    faint reek of the marshes far ahead.
  exits:
    n: tr.emonds_field.south_road
    s: tr.deven_ride
    w: tr.westwood.south
  sector: field

# --- Westwood ---------------------------------------------------------------

- id: tr.westwood.north
  name: The Westwood — north
  short: Pillared firs stretch away westward.
  long: |
    The forest floor is thick with russet needles. Sun spears down in
    narrow shafts where deer have nibbled the lower branches bare.
  exits:
    e: tr.north_road.central
  sector: forest

- id: tr.westwood.south
  name: The Westwood — south
  short: A darker, older stand of trees.
  long: |
    The firs give way to ancient oaks here. Moss carpets the trunks
    knee-deep, and the wind rarely reaches the ground.
  exits:
    e: tr.north_road.south
  sector: forest

# --- Quarry Road / west arm -------------------------------------------------

- id: tr.quarry_road
  name: Quarry Road
  short: A rutted track running west from Emond's Field.
  long: |
    Cart tracks run through the long grass. A lone signpost leans
    westward — the carving worn but still readable: AL'THOR FARM.
    A narrower track branches off south, half-overgrown, climbing
    a low rise toward the derelict shape of the old sickhouse.
  exits:
    e: tr.emonds_field.winespring
    w: tr.althor_farm
    s: tr.old_sickhouse
  sector: field

- id: tr.althor_farm
  name: Al'Thor Farm
  short: A tidy upland farmstead at the edge of the hills.
  long: |
    A low farmhouse of fieldstone and a sturdy barn sit behind a
    drystone wall. Sheep crop the slope behind the barn; tabac dries
    in the loft. A path winds further west toward the Sand Hills.
  exits:
    e: tr.quarry_road
    w: tr.sand_hills
  sector: field

- id: tr.sand_hills
  name: The Sand Hills
  short: Pale, wind-bitten dunes at the foot of the mountains.
  long: |
    Stunted juniper grips the slopes. The Mountains of Mist rear up to
    the west, their lower flanks already swallowed by cloud.
  exits:
    e: tr.althor_farm
    w: shared.mountains_of_mist.foothills
  sector: hills

# --- East: Winespring Water → Waterwood → Mire ------------------------------

- id: tr.winespring_water
  name: The Winespring Water
  short: A clear stream running east of Emond's Field.
  long: |
    Stones smooth as river-glass line the bank. Watercress sways in the
    current. Children fish here in summer; women come at dawn for
    laundry and gossip.
  exits:
    w: tr.emonds_field.bridge_central
    e: tr.waterwood
  sector: water

- id: tr.waterwood
  name: The Waterwood
  short: A tangled wetland forest east of the Two Rivers.
  long: |
    The trees stand half-drowned in still black water. Reeds rattle at
    every footfall; the sky overhead is broken into a hundred glinting
    fragments by the leaves.
  exits:
    w: tr.winespring_water
    s: tr.mire
  sector: forest

- id: tr.mire
  name: The Mire
  short: A treacherous marsh at the southeast of the region.
  long: |
    The water deepens here into a labyrinth of channels and floating
    weed. Frogs boom from the reeds; a heron unfolds itself from a
    deadfall and lifts away on long, deliberate wings.
  exits:
    n: tr.waterwood
  sector: water

# --- Aybara Farm trail (east from village; farm zone deferred) --------------

- id: tr.aybara_trail
  name: The Aybara Farm Trail
  short: A footpath winding east through hedgerows and pasture.
  long: |
    The path runs east of the village along the north bank of the
    Winespring, past lambing pens and a rough-stoned blacksmith's
    paddock. The Aybara farm proper lies a little further on,
    hidden among the trees — Tam al'Thor and Master Luhhan often
    walk down to share a cup with old Aybara. The Sickhouse Lane
    runs back west toward the village.
  exits:
    w: tr.emonds_field.sickhouse_lane
  sector: field
  descriptions:
    paddock: |
      Master Aybara is a blacksmith in his own right, though
      Master Luhhan keeps the village trade. The paddock holds
      half a dozen unshod ponies on most days.

# --- Old Sickhouse (derelict, southwest of the village) ---------------------

- id: tr.old_sickhouse
  name: The Old Sickhouse
  short: A derelict stone-built sickhouse half-swallowed by brambles.
  long: |
    The old sickhouse sits abandoned on a low rise south of the
    Quarry Road. Its slate roof has gone in places; brambles climb
    its south wall and the door hangs at an angle on a single
    hinge. A cracked stone basin lies overturned in the yard,
    half-full of black rainwater. Wind moves through the empty
    rooms with a soft, dry sigh. The track north climbs back to
    the Quarry Road.
  exits:
    n: tr.quarry_road
  flags:
    dark: true
  sector: city
  descriptions:
    basin: |
      The basin is carved from a single block of grey-veined
      limestone — heavier than two men can easily lift. It was
      once used to wash the dead. No one in the village touches
      it now.
    door: |
      The door is split oak, weathered to silver. Generations of
      children have dared each other to step through it; few have
      gone past the porch. The Wisdom does not encourage them.
