# QA Test Zone — Phase A #7. One example item per ItemType, plus
# nested-container fixtures and a torch paired with the dark cellar.
#
# Naming convention: test.qa.<kind>[_<variant>]. Stays out of the
# tr.* namespace so production world content can't collide.

# ─── Shop stock samples (referenced by mobs.yaml shop block) ──────

- id: test.qa.weapon_shortsword
  room: test.qa.shop
  name: a practice shortsword
  short: a notched practice shortsword leans against the counter
  type: weapon
  weight: 3.0
  value: 1sp
  quality: masterwork
  stats:
    proficiency: martial
    size: medium
    range: melee
    damage: "1d6"
    damage_type:
      - P
      - S

- id: test.qa.armor_jerkin
  room: test.qa.shop
  name: a leather jerkin
  short: a plain leather jerkin hangs on a wooden peg
  type: armor
  weight: 15.0
  value: 1sp
  quality: normal
  stats:
    weight_class: light
    bonus: 2
    max_dex: 6
    check_penalty: 0
    speed_ft: 30

