# --- North Road spine -------------------------------------------------------

- id: tr.taren_ferry
  name: Taren Ferry
  short: A ramshackle village clinging to the south bank of the Taren.
  long: |
    Plank houses lean against one another on stilts driven into the muddy
    bank. The Taren itself runs broad and grey to the north, swallowing
    the morning mist; a hand-cranked ferry sits beached on the shingle,
    rope coiled like a sleeping snake beside it. The North Road begins
    here and runs south.
  exits:
    s: tr.taren_road_south
    w: tr.eldenores_veil

- id: tr.eldenores_veil
  name: Eldenore's Veil
  short: A lonely stone overlook above the river.
  long: |
    A weathered cairn marks this spit of high ground above the Taren.
    Local children whisper that an Aes Sedai once watched her enemies
    drown from this very spot — their mothers tell them off for
    repeating it.
  exits:
    e: tr.taren_ferry

- id: tr.taren_road_south
  name: The North Road, near Taren Ferry
  short: A muddy stretch of road south of the ferry.
  long: |
    Wagon ruts trace deep grooves through the wet earth. The river falls
    behind you to the north; ahead the road climbs gently toward Watch
    Hill.
  exits:
    n: tr.taren_ferry
    s: tr.watch_hill

- id: tr.watch_hill
  name: Watch Hill
  short: A modest hilltop village watching the road.
  long: |
    Thatched roofs cluster around an old fire pit where, in elder days,
    the men of the Two Rivers lit a beacon at the first sign of trouble
    from the north. The smell of bread drifts from the village oven.
  exits:
    n: tr.taren_road_south
    s: tr.north_road_central

- id: tr.north_road_central
  name: The North Road, in open country
  short: Open farmland flanks the road on both sides.
  long: |
    Hedgerows of blackthorn and hawthorn wall the road in. To the west
    the Westwood rises in a dark green line; to the east, low fields
    roll away toward the Waterwood.
  exits:
    n: tr.watch_hill
    s: tr.emonds_field
    w: tr.westwood_north

- id: tr.emonds_field
  starter: true
  name: Emond's Field — the Green
  short: The heart of the Two Rivers, before the Winespring Inn.
  long: |
    A wide green opens at the centre of the village. The Winespring
    bubbles up from a rock at one end, and the inn that takes its name
    from the spring stands at the other — whitewashed, slate-roofed,
    smoke curling from a stone chimney. Roads run away to every side,
    and a stone bridge crosses the Winespring Water to the east.
  exits:
    n: tr.north_road_central
    s: tr.north_road_south
    e: tr.winespring_water
    w: tr.quarry_road

- id: tr.north_road_south
  name: The North Road, south of Emond's Field
  short: The road bends away toward Deven Ride.
  long: |
    The hedgerows give way to scattered oaks. A south wind brings the
    faint reek of the marshes far ahead.
  exits:
    n: tr.emonds_field
    s: tr.deven_ride
    w: tr.westwood_south

- id: tr.deven_ride
  name: Deven Ride
  short: A small village at the southern reach of the road.
  long: |
    Stone cottages cluster around a watering trough where shepherds
    bring their flocks down from the southern pastures. Beyond the
    village the road dwindles into a footpath through the trees.
  exits:
    n: tr.north_road_south
    s: tr.forest_of_shadows

- id: tr.forest_of_shadows
  name: The Forest of Shadows — northern margin
  short: The trees crowd close at the southern edge of the Two Rivers.
  long: |
    Old oaks and twisted blackthorns close in around you. The path
    fades among the leaves; the air is colder here, and the birds have
    fallen silent. None of the elder folk in Deven Ride will say what
    lies further south.
  exits:
    n: tr.deven_ride

# --- Westwood ---------------------------------------------------------------

- id: tr.westwood_north
  name: The Westwood — north
  short: Pillared firs stretch away westward.
  long: |
    The forest floor is thick with russet needles. Sun spears down in
    narrow shafts where deer have nibbled the lower branches bare.
  exits:
    e: tr.north_road_central

- id: tr.westwood_south
  name: The Westwood — south
  short: A darker, older stand of trees.
  long: |
    The firs give way to ancient oaks here. Moss carpets the trunks
    knee-deep, and the wind rarely reaches the ground.
  exits:
    e: tr.north_road_south

# --- Quarry Road / west arm -------------------------------------------------

- id: tr.quarry_road
  name: Quarry Road
  short: A rutted track running west from Emond's Field.
  long: |
    Cart tracks run through the long grass. A lone signpost leans
    westward — the carving worn but still readable: AL'THOR FARM.
  exits:
    e: tr.emonds_field
    w: tr.althor_farm

- id: tr.althor_farm
  name: Al'Thor Farm
  short: A tidy upland farmstead at the edge of the hills.
  long: |
    A low farmhouse of fieldstone and a sturdy barn sit behind a
    drystone wall. Sheep crop the slope behind the barn; tabac dries
    in the loft. A path winds further west toward the Sand Hills.
  exits:
    e: tr.quarry_road
    w: tr.sand_hills

- id: tr.sand_hills
  name: The Sand Hills
  short: Pale, wind-bitten dunes at the foot of the mountains.
  long: |
    Stunted juniper grips the slopes. The Mountains of Mist rear up to
    the west, their lower flanks already swallowed by cloud.
  exits:
    e: tr.althor_farm
    w: tr.mountains_of_mist

- id: tr.mountains_of_mist
  name: Foothills of the Mountains of Mist
  short: The land breaks upward into stone.
  long: |
    Bare rock and patches of stubborn grass. The road ends here; only
    sheep tracks climb on into the cloud. No one in living memory has
    crossed those peaks and returned.
  exits:
    e: tr.sand_hills

# --- East: Winespring Water → Waterwood → Mire ------------------------------

- id: tr.winespring_water
  name: The Winespring Water
  short: A clear stream running east of Emond's Field.
  long: |
    Stones smooth as river-glass line the bank. Watercress sways in the
    current. Children fish here in summer; women come at dawn for
    laundry and gossip.
  exits:
    w: tr.emonds_field
    e: tr.waterwood

- id: tr.waterwood
  name: The Waterwood
  short: A tangled wetland forest east of the Two Rivers.
  long: |
    The trees stand half-drowned in still black water. Reeds rattle
    at every footfall; the sky overhead is broken into a hundred
    glinting fragments by the leaves.
  exits:
    w: tr.winespring_water
    s: tr.mire

- id: tr.mire
  name: The Mire
  short: A treacherous marsh at the southeast of the region.
  long: |
    The water deepens here into a labyrinth of channels and floating
    weed. Frogs boom from the reeds; a heron unfolds itself from a
    deadfall and lifts away on long, deliberate wings.
  exits:
    n: tr.waterwood
