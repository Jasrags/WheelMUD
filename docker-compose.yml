services:
  server:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        VERSION: dev
        COMMIT: local
        DATE: "0000-00-00"
    ports:
      - "2323:2323"
      # Metrics + pprof + healthz. Bind to loopback on the host so
      # the pprof endpoint isn't accidentally exposed; the container
      # listens on 0.0.0.0:9090 internally.
      - "127.0.0.1:9090:9090"
    volumes:
      # Persist the database and backups across container restarts.
      - wheelmud-data:/var/lib/wheelmud
      - wheelmud-backups:/var/backups/wheelmud
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wheelmud-data:
  wheelmud-backups:
